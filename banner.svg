<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="void-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-vignette" cx="18%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0B0F14"/>
    </radialGradient>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7C3AED" opacity="0.10"/>
    </pattern>
    <style>
      .trace { stroke: #7C3AED; stroke-width: 1.1; fill: none; opacity: 0.38; }
      .pad { fill: #7C3AED; opacity: 0.55; }
      .ring { fill: none; stroke: #7C3AED; }
      .wordmark { font-family: "JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
      .orbit { transform-origin: 172px 140px; animation: spin 120s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg-vignette)"/>
  <rect width="1000" height="280" fill="url(#dotgrid)"/>

  <!-- circuit traces radiating from the event horizon -->
  <g class="trace">
    <path d="M 172 60 L 172 34 L 230 34 L 230 20"/>
    <path d="M 172 220 L 172 246 L 120 246 L 120 262"/>
    <path d="M 92 112 L 48 112 L 48 70"/>
    <path d="M 92 168 L 40 168 L 40 210 L 16 210"/>
    <path d="M 252 140 L 300 140"/>
    <path d="M 232 82 L 268 60 L 268 30"/>
    <path d="M 232 198 L 260 218 L 300 218"/>
  </g>
  <g class="pad">
    <rect x="228" y="17" width="5" height="5"/>
    <rect x="117" y="259" width="5" height="5"/>
    <rect x="45" y="67" width="5" height="5"/>
    <rect x="13" y="207" width="5" height="5"/>
    <rect x="297" y="137.5" width="5" height="5"/>
    <rect x="265" y="27" width="5" height="5"/>
    <rect x="297" y="215" width="5" height="5"/>
  </g>

  <!-- event horizon -->
  <g class="orbit">
    <circle cx="172" cy="140" r="118" class="ring" stroke-width="0.6" opacity="0.18"/>
    <circle cx="172" cy="140" r="100" class="ring" stroke-width="0.8" opacity="0.28"/>
  </g>
  <circle cx="172" cy="140" r="85" class="ring" stroke-width="1" opacity="0.5"/>
  <circle cx="172" cy="140" r="70" fill="url(#void-core)"/>
  <circle cx="172" cy="140" r="70" class="ring" stroke-width="1.4" opacity="0.85"/>

  <!-- wordmark -->
  <text x="340" y="130" class="wordmark" font-size="42" font-weight="600" letter-spacing="6" fill="#E5E7EB">RET2VOID</text>
  <text x="342" y="160" class="wordmark" font-size="13" letter-spacing="2" fill="#7C3AED" opacity="0.85">return address: void</text>
  <text x="342" y="190" class="wordmark" font-size="12" letter-spacing="1" fill="#6B7280">soc -&gt; binary exploitation -&gt; firmware -&gt; orbit</text>
  <text x="342" y="216" class="wordmark" font-size="13" fill="#7C3AED">&gt; compiling</text>
  <rect x="437" y="204" width="8" height="14" fill="#E5E7EB">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
